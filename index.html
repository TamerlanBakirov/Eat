<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FitLife — Beslenme ve antrenman takibini tek uygulamada birleştiren kişisel sağlık asistanı">
  <title>FitLife — Beslenme & Antrenman Takibi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- Kenar çubuğu / Alt navigasyon -->
    <nav class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-icon">⚡</span>
        <span class="brand-name">FitLife</span>
      </div>
      <ul class="nav-list">
        <li><button class="nav-item active" data-view="dashboard"><span class="nav-icon">📊</span><span class="nav-label">Özet</span></button></li>
        <li><button class="nav-item" data-view="nutrition"><span class="nav-icon">🍎</span><span class="nav-label">Beslenme</span></button></li>
        <li><button class="nav-item" data-view="workout"><span class="nav-icon">🏋️</span><span class="nav-label">Antrenman</span></button></li>
        <li><button class="nav-item" data-view="progress"><span class="nav-icon">📈</span><span class="nav-label">İlerleme</span></button></li>
        <li><button class="nav-item" data-view="profile"><span class="nav-icon">👤</span><span class="nav-label">Profil</span></button></li>
      </ul>
      <div class="sidebar-footer">
        <button class="theme-toggle" id="themeToggle" title="Tema değiştir">🌙</button>
      </div>
    </nav>

    <!-- Ana içerik -->
    <main class="main" id="main">
      <header class="topbar">
        <h1 class="view-title" id="viewTitle">Özet</h1>
        <div class="date-nav">
          <button class="date-btn" id="prevDay" title="Önceki gün">‹</button>
          <input type="date" id="datePicker" class="date-picker">
          <button class="date-btn" id="nextDay" title="Sonraki gün">›</button>
          <button class="date-btn today-btn" id="todayBtn">Bugün</button>
        </div>
      </header>
      <div class="view-container" id="viewContainer"></div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Bildirim -->
  <div class="toast hidden" id="toast"></div>

  <script src="js/data/foods.js"></script>
  <script src="js/data/exercises.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/nutrition.js"></script>
  <script src="js/views/workout.js"></script>
  <script src="js/views/progress.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
